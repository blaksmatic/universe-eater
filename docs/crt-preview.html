<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Eater — CRT Preview (A)</title>
<style>
  :root { --bg:#050508; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:#cfe6ff;font-family:"SFMono-Regular",Menlo,monospace;overflow:hidden;touch-action:none}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:8px;align-items:center;padding:10px 12px;background:rgba(10,16,30,0.92);border-bottom:1px solid rgba(120,180,255,0.22);flex-wrap:wrap}
  #bar h1{font-size:13px;letter-spacing:0.08em;color:#8ec0ff;margin-right:8px}
  #bar button{appearance:none;border:1px solid rgba(140,180,255,0.22);background:rgba(255,255,255,0.06);color:#e6f0ff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  #bar button.active{background:rgba(80,160,255,0.28);border-color:rgba(120,200,255,0.55);color:#fff;box-shadow:0 0 12px rgba(80,160,255,0.35)}
  #bar .hint{margin-left:auto;font-size:11px;color:#8aa0c2}
  #stage{position:fixed;inset:44px 0 0 0;display:grid;place-items:center;padding:12px;background:radial-gradient(800px 600px at 50% 40%, rgba(40,60,120,0.18), transparent 60%), #05070f}
  #frame{position:relative;width:min(980px,96vw);height:min(560px,68vh);border-radius:10px;overflow:hidden;background:#060913;box-shadow:0 20px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(120,180,255,0.15);transform:perspective(900px)}
  #gamePreview{width:100%;height:100%;display:block}
  /* CRT curvature via CSS */
  #crt{position:absolute;inset:0;pointer-events:none;border-radius:10px;overflow:hidden}
  .scanlines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px);opacity:0.55;mix-blend-mode:multiply}
  .vignette{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 92%);}
  .chroma{position:absolute;inset:0;opacity:0;mix-blend-mode:screen}
  /* mode tints */
  body.mode-amber #frame{filter:contrast(1.08) saturate(0.9) sepia(0.18) hue-rotate(-8deg)}
  body.mode-rgb #frame{filter:contrast(1.12) saturate(1.05)}
  body.mode-vector #frame{filter:contrast(1.18) saturate(0.45) brightness(1.02)}
  body.mode-amber .chroma{opacity:0.06;background:linear-gradient(90deg, rgba(255,60,40,0.06), transparent 2px, rgba(60,255,210,0.05) 100%)}
  body.mode-rgb .chroma{opacity:0.14;background:linear-gradient(90deg, rgba(255,40,90,0.07) 0, transparent 1.5px, transparent calc(100% - 1.5px), rgba(80,220,255,0.08) 100%)}
  body.mode-vector .chroma{opacity:0.08}
  #live{position:absolute;inset:0;display:none}
  #live iframe{width:100%;height:100%;border:0;background:#000}
  .badge{position:absolute;left:10px;bottom:10px;background:rgba(10,16,30,0.85);border:1px solid rgba(120,180,255,0.18);color:#b8d2ff;border-radius:8px;padding:6px 8px;font-size:11px}
</style>
</head>
<body class="mode-amber">
<div id="bar">
  <h1>CRT PREVIEW — press 1/2/3</h1>
  <button data-mode="amber" class="active">1 · Amber Tube</button>
  <button data-mode="rgb">2 · RGB Phosphor</button>
  <button data-mode="vector">3 · Green Vector</button>
  <button id="toggleLive">Live game</button>
  <span class="hint">Amber = warm readable · RGB = arcade · Vector = stroke-only · ESC hides bar</span>
</div>
<div id="stage">
  <div id="frame">
    <canvas id="gamePreview" width="980" height="560"></canvas>
    <div id="crt"><div class="scanlines"></div><div class="vignette"></div><div class="chroma"></div></div>
    <div id="live"><iframe id="liveFrame" src="../index.html"></iframe></div>
    <div class="badge" id="badge">AMBER TUBE — sepia 0.18 · scan 0.32 · grain 2% · curve 4% · phosphor 80ms</div>
  </div>
</div>
<script>
const canvas = document.getElementById('gamePreview');
const ctx = canvas.getContext('2d');
const badge = document.getElementById('badge');
const body = document.body;
const buttons = [...document.querySelectorAll('#bar button[data-mode]')];
const live = document.getElementById('live');
const toggleLive = document.getElementById('toggleLive');

let mode='amber';
let t=0;
let showLive=false;

const DESCS={
  amber: "AMBER TUBE — sepia 0.18 · scan 0.32 · grain 2% · curve 4% · phosphor 80ms",
  rgb:   "RGB PHOSPHOR — split 0.7px · scan 0.22 · grain 1% · curve 3% · cool neon",
  vector:"GREEN VECTOR — stroke-only · grid 0.08 · scan 0.18 · vector bloom"
};

function setMode(m){
  mode=m;
  body.className = 'mode-'+m + (showLive? ' live':'');
  buttons.forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  badge.textContent = DESCS[m];
  // frame curvature
  const f=document.getElementById('frame');
  f.style.transform = m==='vector' ? 'perspective(900px) scale(1.01)' : 'perspective(900px)';
  f.style.borderRadius = m==='amber' ? '14px' : '10px';
}

buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
toggleLive.addEventListener('click',()=>{
  showLive=!showLive;
  live.style.display = showLive? 'block':'none';
  canvas.style.display = showLive? 'none':'block';
  toggleLive.textContent = showLive? 'Mock preview' : 'Live game';
  toggleLive.classList.toggle('active', showLive);
});
window.addEventListener('keydown',e=>{
  if(e.key==='1') setMode('amber');
  if(e.key==='2') setMode('rgb');
  if(e.key==='3') setMode('vector');
  if(e.key.toLowerCase()==='l') toggleLive.click();
  if(e.key==='Escape') document.getElementById('bar').style.display = document.getElementById('bar').style.display==='none' ? 'flex':'none';
});

// Mock scene painter — neon void with HUD
function roundedRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.moveTo(x+rr,y); ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
  ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
  ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y); ctx.closePath();
}

function drawMock(time){
  const w=canvas.width, h=canvas.height;
  // bg
  const g=ctx.createRadialGradient(w*0.5,h*0.45,0,w*0.5,h*0.45,Math.max(w,h));
  if(mode==='amber'){ g.addColorStop(0,'#1a1206'); g.addColorStop(0.5,'#0e0f1a'); g.addColorStop(1,'#050508'); }
  else if(mode==='rgb'){ g.addColorStop(0,'#0a1020'); g.addColorStop(1,'#040608'); }
  else { g.addColorStop(0,'#060a06'); g.addColorStop(1,'#030405'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // grid
  ctx.save(); ctx.strokeStyle = mode==='vector' ? 'rgba(90,255,140,0.07)' : 'rgba(80,160,255,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<w;x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<h;y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.restore();
  // stars
  for(let i=0;i<90;i++){
    const x=(i*137.5)%w, y=(i*73)%h, s= (i%3===0?2.2:1);
    const tw=0.5+0.5*Math.sin(time*0.8 + i);
    ctx.fillStyle=`rgba(${mode==='amber'?'255,210,120': mode==='vector'?'120,255,140':'170,210,255'},${0.15+tw*0.35})`;
    ctx.beginPath(); ctx.arc((x+time*6)%w, y, s, 0, Math.PI*2); ctx.fill();
  }
  // mock ship + enemies
  const cx=w*0.5, cy=h*0.5;
  // ship
  ctx.save(); ctx.translate(cx,cy-10);
  if(mode==='vector'){ ctx.strokeStyle='rgba(120,255,140,0.9)'; ctx.lineWidth=1.6; }
  else { ctx.fillStyle='rgba(200,235,255,0.95)'; }
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,10); ctx.lineTo(0,4); ctx.lineTo(-10,10); ctx.closePath();
  mode==='vector' ? ctx.stroke() : ctx.fill(); ctx.restore();
  // orbit ring
  ctx.strokeStyle = mode==='amber' ? 'rgba(255,190,60,0.22)' : mode==='vector' ? 'rgba(90,255,140,0.18)' : 'rgba(90,200,255,0.18)';
  ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy-10,70,0,Math.PI*2); ctx.stroke();
  // enemies
  for(let i=0;i<5;i++){
    const ang=time*0.4 + i*1.26, r=120+i*38;
    const ex=cx+Math.cos(ang)*r, ey=cy+Math.sin(ang)*0.9*r;
    ctx.strokeStyle = i===2 ? 'rgba(255,60,90,0.9)' : 'rgba(255,120,90,0.7)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(ex,ey,12+ (i%2)*6,0,Math.PI*2); ctx.stroke();
    // hp fill
    ctx.fillStyle='rgba(255,90,90,0.85)'; ctx.fillRect(ex-10,ey-18,20*(0.6+0.2*Math.sin(time+i)),3);
  }
  // HUD panels - amber bezel vs glass
  const hudY=12;
  // hull chip
  ctx.save();
  if(mode==='amber'){
    ctx.fillStyle='rgba(28,20,10,0.92)'; ctx.strokeStyle='rgba(255,190,60,0.28)'; 
  } else if(mode==='vector'){ ctx.strokeStyle='rgba(120,255,140,0.5)'; ctx.fillStyle='rgba(10,20,12,0.6)'; }
  else { ctx.fillStyle='rgba(12,18,40,0.72)'; ctx.strokeStyle='rgba(120,180,255,0.22)'; }
  ctx.lineWidth=1; ctx.beginPath(); roundedRect(ctx, 12, hudY, 148, 42, mode==='amber'?6:10); mode==='vector'? ctx.stroke(): (ctx.fill(), ctx.stroke());
  ctx.fillStyle = mode==='amber' ? '#ffd27a' : mode==='vector' ? '#8cff8a' : '#d8ecff';
  ctx.font='bold 13px monospace'; ctx.fillText('HULL  84%', 22, hudY+18);
  // hp bar
  ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.beginPath(); roundedRect(ctx,22,hudY+24,108,6,3); ctx.fill();
  ctx.fillStyle = mode==='vector' ? 'rgba(120,255,140,0.9)' : 'rgba(255,190,60,0.95)'; ctx.beginPath(); roundedRect(ctx,22,hudY+24,108*0.84,6,3); ctx.fill();
  ctx.restore();
  // kills chip
  ctx.save(); ctx.textAlign='right'; ctx.font='bold 14px monospace'; ctx.fillStyle='#e6f0ff';
  const killsW=84; ctx.beginPath(); roundedRect(ctx,w-12-killsW,hudY, killsW,30,8); ctx.fillStyle= mode==='amber'?'rgba(28,20,10,0.92)':'rgba(12,18,40,0.72)'; ctx.fill(); ctx.strokeStyle='rgba(120,180,255,0.18)'; ctx.stroke();
  ctx.fillStyle='#e6f0ff'; ctx.fillText('2,418', w-22, hudY+19); ctx.restore();
  // timer
  ctx.save(); ctx.textAlign='center';
  if(mode==='amber'){ ctx.fillStyle='rgba(255,210,120,0.95)'; ctx.shadowColor='rgba(255,160,40,0.5)'; ctx.shadowBlur=12; }
  else if(mode==='vector'){ ctx.strokeStyle='rgba(120,255,140,0.9)'; ctx.lineWidth=1.2; }
  ctx.font='bold 28px monospace';
  const tt='2:47';
  mode==='vector' ? (ctx.strokeText(tt,w/2,32)) : ctx.fillText(tt,w/2,30);
  ctx.restore();
  // scanline jitter + flicker overlay is CSS, but add subtle noise via canvas
  if(mode!=='vector'){
    ctx.fillStyle=`rgba(255,255,255,${0.015 + 0.01*Math.sin(time*60)})`;
    for(let i=0;i<120;i++){ const nx=Math.random()*w, ny=Math.random()*h; ctx.fillRect(nx,ny,1,1); }
  }
}

function frame(now){
  t=now*0.001;
  drawMock(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setMode('amber');
</script>
</body>
</html>
